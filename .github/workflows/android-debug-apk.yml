name: Android APK

# Builds a sideloadable **release** Android APK (arm64) when a release is published, and attaches it
# to that GitHub Release. Also runnable on demand from the Actions tab. This is the CI mirror of
# `scripts/run-android.sh` (release) — debug-key signed (via the release signingConfig), no secrets
# needed, R8-minified + native libs compressed so it's ~half the size of the old debug artifact. The
# Play-grade signed AAB is a separate, local, keystore-backed flow (see docs/release.md §2b).
#
# NOTE (first run): Skip's Android toolchain setup (Swift Android SDK + NDK) is exacting. If the first
# run fails, the error usually names the exact missing/mismatched piece (e.g. an NDK version or a
# Swift-toolchain/SDK version skew) — pin that here and re-run. `skip doctor` output in the log helps.

on:
  release:
    types: [published]
  workflow_dispatch: {}   # manual trigger from the Actions tab

permissions:
  contents: write         # needed to attach the APK to the release

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS: Skip Fuse compiles Swift natively for Android via the Swift Android SDK, and the Skip
    # toolchain targets macOS. Android SDK + Java come preinstalled on the runner.
    #
    # `xcode-27` is GitHub's Xcode 27 image (macOS 27, arm64). It is a PREVIEW image — there is no GA
    # `macos-27` label yet — but it is the only one with Xcode 27, and Xcode 27 is what the project
    # builds with locally. It ships Xcode 27.0 build 27A266a, byte-identical to local. When a GA
    # `macos-27` label appears, switch to it.
    runs-on: xcode-27
    env:
      # The Swift Android SDK + host toolchain Skip installs. See the pin rationale below.
      SWIFT_ANDROID_SDK_VERSION: '6.4.0'

    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      # PINNED, not `latest-stable`. The Android cross-compile reads Xcode's macOS SDK for package
      # manifests, so Xcode's major version and SWIFT_ANDROID_SDK_VERSION must move TOGETHER: the
      # 6.3.2 toolchain crashes on the macOS 27 SDK ("unknown argument: '-target-arch-variant'").
      # Floating Xcode can therefore break the Android build with no repo change.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      # Gradle's JDK, matching local (Homebrew openjdk@25). The image defaults to 21 and exports each
      # installed JDK as JAVA_HOME_<v>_arm64.
      - name: Use JDK 25
        run: echo "JAVA_HOME=$JAVA_HOME_25_arm64" >> "$GITHUB_ENV"

      # Skip CLI drives transpile + Gradle + Swift-for-Android; the project has no gradlew, so it
      # uses a system Gradle (mirrors Android/fastlane/Fastfile, which calls the Homebrew gradle).
      - name: Install Skip + Gradle
        run: brew install skiptools/skip/skip gradle

      # swiftly is REQUIRED, not a convenience. `skip android sdk install` installs the matching host
      # toolchain through swiftly when it's present (`swiftly install 6.4.0` — correct URL). Without it,
      # Skip builds the download URL itself and drops the patch version:
      #     …/swift-6.4-release/xcode/swift-6.4-RELEASE/swift-6.4-RELEASE-osx.pkg   (doesn't exist)
      # instead of …/swift-6.4.0-release/xcode/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE-osx.pkg. That is
      # what failed here on 2026-09-17 and again on 2026-09-23; locally it always worked because the
      # dev machine has swiftly. `--skip-install`: Skip installs the exact toolchain it needs below.
      - name: Install swiftly
        run: |
          brew install swiftly
          swiftly init --assume-yes --skip-install --no-modify-profile --quiet-shell-followup
          . "$HOME/.swiftly/env.sh"
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          {
            echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR"
            echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR"
            echo "SWIFTLY_TOOLCHAINS_DIR=$SWIFTLY_TOOLCHAINS_DIR"
          } >> "$GITHUB_ENV"

      # Base Android SDK pieces (cmdline-tools, platform-tools) into ANDROID_HOME.
      - name: Install Android SDK (skip android home)
        run: skip android home install

      # Cache the Swift Android SDK so re-runs skip the ~2-min download/install. Keyed to the Skip
      # pin in Package.swift AND the pinned SDK version below, so bumping either re-installs.
      # `skip android sdk install` below is idempotent — it no-ops fast on a cache hit.
      - name: Cache Swift Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm/swift-sdks
            ~/Library/org.swift.swiftpm/swift-sdks
          key: swift-android-sdk-${{ runner.os }}-${{ env.SWIFT_ANDROID_SDK_VERSION }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            swift-android-sdk-${{ runner.os }}-${{ env.SWIFT_ANDROID_SDK_VERSION }}-

      # Swift cross-compilation SDK for Android (the Fuse native-Android build).
      #
      # PINNED, deliberately. Unpinned, `skip android sdk install` resolves the LATEST SDK version and
      # then downloads a matching HOST toolchain to go with it — and on 2026-09-17 that resolved 6.4.0
      # and died with:
      #     Error: Swift 6.4.0 does not exist at URL
      #     https://download.swift.org/swift-6.4-release/xcode/swift-6.4-RELEASE/swift-6.4-RELEASE-osx.pkg
      # It looked like swift.org hadn't published 6.4.0 yet. It had: the URL was malformed because the
      # runner had no swiftly — see "Install swiftly" above. Pinning is still right regardless.
      #
      # 6.4.0 is what the project builds with locally (Xcode 27 / Swift 6.4, SDK
      # swift-6.4.0-RELEASE_android) since 2026-09-23. Use the FULL version — `--version 6.4` resolves
      # nothing. Bump it deliberately, together with Xcode and a local verification, never by floating.
      #
      # NDK: the 6.4.0 SDK downloads NDK r30 into its own bundle and links it (bdk-android needs 27+,
      # CLAUDE.md §3). The image exports ANDROID_NDK_HOME=27.3; it's unset here so the install links
      # the SDK's own NDK, exactly as it does locally (where ANDROID_NDK_HOME is unset).
      - name: Install Swift Android SDK (skip android sdk)
        run: |
          unset ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK
          skip android sdk install --version "$SWIFT_ANDROID_SDK_VERSION"

      - name: Diagnose toolchain
        run: skip doctor || true

      # Gradle's content-addressed caches + downloaded modules. Safe across machines (Gradle keys
      # entries by task-input hashes). We deliberately do NOT cache the compiled Swift/Kotlin build
      # products: this project's incremental Android transpile can desync when WalletService changes
      # ("Cannot access … internal" — see the build-speed notes), so we cache only immutable layers
      # and let the compile itself run clean each time.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Android/**/*.gradle*', 'Android/gradle.properties', 'Package.swift') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # SwiftPM dependency SOURCES only (checkouts/repos/resolved artifacts) — avoids re-cloning BDK,
      # secp256k1, Skip, etc. on every run. Excludes build products for the same reason as above.
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
          key: spm-deps-${{ runner.os }}-${{ hashFiles('Package.swift', 'Packages/WalletService/Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-deps-${{ runner.os }}-

      # Firebase config (gitignored — not in the repo). The google-services Gradle plugin requires
      # Android/app/google-services.json present at build time, so decode it from a repo secret.
      # Create the secret: `base64 -i Android/app/google-services.json` → repo Settings → Secrets →
      # Actions → GOOGLE_SERVICES_JSON_BASE64. (GoogleService-Info.plist is iOS-only; not needed here.)
      - name: Write google-services.json
        run: base64 -D <<< "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" > Android/app/google-services.json

      # Sign every release with the SAME stable keystore so sideloaded updates install in place
      # (a different key each build → "signature mismatch" → users must uninstall+reinstall, losing
      # data). Decode the repo's release keystore + its keystore.properties from secrets into the
      # module dir; build.gradle.kts's release signingConfig picks up keystore.properties when present.
      # (This is the same key local release builds already use.) Set these two secrets:
      #   ANDROID_KEYSTORE_BASE64            = base64 of Android/app/keystore.jks
      #   ANDROID_KEYSTORE_PROPERTIES_BASE64 = base64 of Android/app/keystore.properties
      - name: Set up release signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROPS_B64: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PROPS_B64" ]; then
            base64 -D <<< "$KEYSTORE_B64" > Android/app/keystore.jks
            base64 -D <<< "$KEYSTORE_PROPS_B64" > Android/app/keystore.properties
            echo "Signing with the stable release keystore → in-place updates."
          else
            echo "::warning::No signing-keystore secrets set — falling back to a per-run debug key, so users must UNINSTALL+reinstall to update. Add ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PROPERTIES_BASE64 to fix."
          fi

      # Fallback only: if no stable keystore was provided above, the release signingConfig falls back
      # to the debug keystore (Android/app/build.gradle.kts), which a fresh runner won't have — create
      # the canonical one so the build at least still produces a (per-run-signed) APK.
      - name: Ensure Android debug keystore exists (fallback signing)
        run: |
          KS="$HOME/.android/debug.keystore"
          if [ ! -f "$KS" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$KS" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Release, arm64 only, no iOS leg. Release (not debug) because it's ~85MB smaller (R8 minify +
      # optimized Swift) AND faster at runtime, and it needs NO extra secrets — the release
      # signingConfig signs with the debug keystore ensured above, so this is still a freely-
      # sideloadable, debug-key-signed APK (same as before, just smaller).
      - name: Build release APK
        run: skip export --release --no-ios --arch aarch64

      - name: Stage APK with a versioned name
        id: apk
        run: |
          set -euo pipefail
          SRC=.build/skip-export/ECashWalletMobile-release.apk
          [ -f "$SRC" ] || { echo "::error::APK not found at $SRC"; ls -R .build/skip-export || true; exit 1; }
          VERSION=$(grep -E '^MARKETING_VERSION' Skip.env | sed -E 's/.*=[[:space:]]*//' | tr -d '[:space:]')
          DEST="eCashWallet-${VERSION:-0.0.0}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Attach to the GitHub Release when this run was triggered by publishing one.
      - name: Attach APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.apk.outputs.path }}" --clobber

      # --- Failure diagnostics -------------------------------------------------------------------
      # Skip writes a detailed log to /tmp/skip-export-*.txt on the runner, which is destroyed when
      # the job ends. On failure, print its tail to the Actions console AND upload the full logs +
      # Gradle reports as an artifact, so the real error is retrievable after the run.
      - name: Print Skip export log on failure
        if: failure()
        run: |
          echo "===================== skip export detailed log(s) ====================="
          shopt -s nullglob
          for f in /tmp/skip-export-*.txt; do
            echo "----- $f -----"
            tail -c 300000 "$f"
          done
          echo "===================== Gradle text reports ====================="
          find .build -path "*reports*" -name "*.txt" -exec sh -c 'echo "----- $1 -----"; cat "$1"' _ {} \; 2>/dev/null | head -c 200000 || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: skip-export-failure-logs
          path: |
            /tmp/skip-export-*.txt
            .build/Android/**/reports/**
          if-no-files-found: warn
